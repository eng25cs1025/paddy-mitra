<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Paddy Mitra</title>
    <link rel="icon" type="image/svg+xml" href="/paddy-mitra-logo.svg">
    <style>
        :root {
            --green: #237b4b;
            --dark: #17342b;
            --muted: #718078;
            --line: #e1eae1;
            --bg: #f5faf4
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #edf8ed, #fdfcf7);
            color: var(--dark);
            font: 14px system-ui, sans-serif
        }

        .register {
            width: min(420px, calc(100% - 30px));
            padding: 34px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 20px 50px #225d3214
        }

        .brand {
            text-align: center
        }

        .brand img {
            width: 66px;
            height: 66px
        }

        .brand h1 {
            margin: 10px 0 3px;
            font-size: 26px;
            letter-spacing: -1px
        }

        .brand p {
            margin: 0;
            color: var(--muted)
        }

        form {
            margin-top: 24px
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 700;
            font-size: 12px
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: none;
            font: inherit
        }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px #237b4b18
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            color: #fff;
            background: var(--green);
            font-weight: 800;
            cursor: pointer
        }

        button:hover {
            background: #145b38
        }

        .message {
            display: none;
            margin-top: 13px;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px
        }

        .error {
            color: #a32f25;
            background: #fff0ed
        }

        .success {
            color: #28663c;
            background: #e7f4e9
        }

        .back {
            display: block;
            margin-top: 18px;
            color: var(--green);
            text-align: center;
            font-size: 12px;
            text-decoration: none
        }
    </style>
</head>

<body>
    <main class="register">
        <div class="brand"><img src="/paddy-mitra-logo.svg" alt="Paddy Mitra logo">
            <h1>Create your account</h1>
            <p>ಪಾಡಿ ಮಿತ್ರ · धान मित्र</p>
        </div>
        <form id="registerForm">
            <label for="name">Farmer name</label><input id="name" required placeholder="Enter your name">
            <label for="username">Username</label><input id="username" required minlength="3" pattern="[A-Za-z0-9_]+"
                placeholder="At least 3 letters or numbers">
            <label for="password">Password</label><input id="password" type="password" required minlength="6"
                placeholder="At least 6 characters">
            <label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" required
                minlength="6" placeholder="Repeat your password">
            <button type="submit">Create account →</button>
            <div class="message error" id="error"></div>
            <div class="message success" id="success">Account created. Redirecting to login…</div>
        </form>
        <a class="back" href="/">Already have an account? Login</a>
    </main>
    <script>
        const API_BASE = '';
        document.getElementById('registerForm').addEventListener('submit', async event => {
            event.preventDefault();
            const error = document.getElementById('error');
            const success = document.getElementById('success');
            error.style.display = 'none';
            if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
                error.textContent = 'Passwords do not match.';
                error.style.display = 'block';
                return;
            }
            try {
                const response = await fetch(API_BASE + '/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('name').value.trim(), username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }) });
                const raw = await response.text();
                let data;
                try {
                    data = JSON.parse(raw);
                } catch {
                    throw new Error(`Server returned an invalid response (${response.status}). Open the app URL directly and refresh.`);
                }
                if (!response.ok) throw new Error(data.error || 'Registration failed');
                success.style.display = 'block';
                setTimeout(() => window.location.href = API_BASE + data.redirect, 700);
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
            }
        });
    </script>
</body>

</html>
